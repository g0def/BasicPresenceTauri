name: Release

# TODO(supply-chain): pin every `uses:` below to a full commit SHA.
#
# This job holds TAURI_SIGNING_PRIVATE_KEY. Six third-party actions run inside
# it on mutable refs (`@v4`, and `dtolnay/rust-toolchain@stable` is a *branch*),
# so any one of those repositories can move its ref and execute code next to the
# signing key — no compromise of this GitHub account required. Step-scoped `env`
# does not help: earlier steps share the runner and can shim `cargo`/`node`.
#
# Replace each ref with its digest, keeping the version in a comment:
#   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
# Resolve one with:
#   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
# Dependabot (.github/dependabot.yml) then keeps the digests current for you —
# it maintains pinned SHAs but will not convert a tag into one.
#
# The stronger fix, which also closes E1 of the security audit: build unsigned
# in CI and sign locally, so the key never reaches a runner at all.

on:
  push:
    tags:
      - "v*"

# Do not cancel in-progress releases — partial matrix jobs would orphan artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.platform }} ${{ matrix.args }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          # macOS — Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # Linux (oldest supported Ubuntu for glibc compatibility)
          - platform: ubuntu-22.04
            args: ""
          # Windows
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pre-install cross-compilation targets for macOS universal builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - run: pnpm install --frozen-lockfile

      # Guard: installed clients poll the endpoint pinned in tauri.conf.json, and
      # tauri-action publishes to the repository running this workflow. If the
      # two drift, every client silently stays on its old version (the updater
      # swallows a failed check) and a security fix reaches nobody.
      #
      # Worth keeping because the account has been renamed before. GitHub keeps
      # the old name working through a redirect, which makes a stale URL look
      # healthy — right up until someone registers the freed name and inherits
      # the traffic. Comparing against GITHUB_REPOSITORY pins the check to the
      # current owner instead of trusting a redirect.
      - name: Check the updater endpoint matches the publish target
        shell: bash
        run: |
          endpoint=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.endpoints[0]")
          echo "updater endpoint: $endpoint"
          echo "publishing to:    ${GITHUB_REPOSITORY}"
          case "$endpoint" in
            "https://github.com/${GITHUB_REPOSITORY}/releases/"*) ;;
            *)
              echo "::error::Updater endpoint does not point at ${GITHUB_REPOSITORY}."
              echo "::error::Clients poll $endpoint but this workflow publishes to ${GITHUB_REPOSITORY}."
              exit 1
              ;;
          esac

      - name: Build, sign & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BasicPresence v__VERSION__"
          # Draft so publishing is a manual final gate.
          # latest.json resolves for clients only once the release is published (non-prerelease).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
