name: Release

on:
  push:
    tags:
      - "v*"

# Do not cancel in-progress releases — partial matrix jobs would orphan artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default: each job asks for exactly what it needs.
permissions: {}

jobs:
  # Same gates as CI, re-run on the exact tagged commit before anything is
  # built or signed.
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # No dependency cache in the release workflow (cache poisoning).
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=high

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check

  release:
    name: Build & publish (${{ matrix.platform }} ${{ matrix.args }})
    needs: verify
    # The signing key lives in this protected environment (required reviewer,
    # restricted to protected `v*` tags): a stolen GitHub token alone cannot
    # produce a signed update. See documentation/release.md.
    environment: release
    permissions:
      contents: write # create the draft release and upload artifacts
      id-token: write # OIDC for the build-provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          # macOS — Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # Linux (oldest supported Ubuntu for glibc compatibility)
          - platform: ubuntu-22.04
            args: ""
          # Windows
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    # No dependency caches in this job on purpose: it holds the signing key, and
    # a cache written by another (less trusted) run could inject code into the
    # signed build (cache poisoning). A clean build is slower but trustworthy.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The local-test updater config (plain HTTP + insecure transport) must
      # never reach a release build.
      - name: Refuse test-only configuration
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
        run: |
          case "$BUILD_ARGS" in
            *--config*|*localtest*) echo "::error::release builds must use tauri.conf.json only"; exit 1 ;;
          esac

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # No dependency cache in the release workflow (cache poisoning).
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          # Pre-install cross-compilation targets for macOS universal builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - run: pnpm install --frozen-lockfile

      - name: Build, sign & publish
        id: tauri
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BasicPresence v__VERSION__"
          # Draft so publishing is a manual final gate.
          # latest.json resolves for clients only once the release is published (non-prerelease).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # SLSA build provenance: anyone can check that an artifact was built by
      # this workflow from this commit (`gh attestation verify <file> -R <repo>`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}

  sbom:
    name: SBOM + checksums
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM / checksums to the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # CycloneDX SBOM of both dependency trees (pnpm-lock.yaml + Cargo.lock).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: basic-presence-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # SHA-256 of every published artifact: the AUR PKGBUILD pins these.
      - name: Upload SBOM and checksums to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist-release
          gh release download "$TAG" --dir dist-release --pattern '*.deb' --pattern '*.AppImage' --pattern '*.rpm' --pattern '*.dmg' --pattern '*.msi' --pattern '*.exe' -R "$GITHUB_REPOSITORY"
          (cd dist-release && sha256sum -- * > ../SHA256SUMS)
          gh release upload "$TAG" "basic-presence-${TAG}.cdx.json" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
