name: Release

# Two ways in, same pipeline:
# - bumping `version` in package.json on main (the usual way: merge the PR);
# - pushing a `v*` tag by hand (fallback, e.g. to rebuild a version).
# Either way the result is a DRAFT release: publishing it stays manual and is
# what ships the update (tag creation, latest.json, pacman repository).
on:
  push:
    branches: [main]
    paths: [package.json]
    tags:
      - "v*"

# Do not cancel in-progress releases — partial matrix jobs would orphan artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default: each job asks for exactly what it needs.
permissions: {}

jobs:
  # Decides whether this push is a release and of which version. On main, only
  # a changed `version` that has no release yet goes on (any other package.json
  # change stops here). On a tag, the tag must match package.json.
  detect:
    name: Detect release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # to read package.json as it was before this push

      - name: Compare versions
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version_at() { git show "$1:package.json" | jq -r .version; }
          VERSION=$(jq -r .version package.json)
          TAG="v${VERSION}"
          if [ "$EVENT_REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$TAG" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $VERSION"
              exit 1
            fi
          else
            PREVIOUS=$(version_at "$BEFORE" 2>/dev/null || echo "")
            if [ "$PREVIOUS" = "$VERSION" ]; then
              echo "Version unchanged ($VERSION): not a release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::warning::release $TAG already exists: nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Version bump ${PREVIOUS:-?} -> $VERSION: releasing $TAG."
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Same gates as CI, re-run on the exact commit before anything is built or
  # signed.
  verify:
    name: Verify release commit
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version: read from `packageManager` in package.json (single source).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in the release workflow (cache poisoning).
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=high

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check

  release:
    name: Build & publish (${{ matrix.platform }} ${{ matrix.args }})
    needs: [detect, verify]
    # The signing key lives in this protected environment (required reviewer,
    # restricted to protected `main` and `v*` tags): a stolen GitHub token alone
    # cannot produce a signed update. See documentation/release.md.
    environment: release
    permissions:
      contents: write # create the draft release and upload artifacts
      id-token: write # OIDC for the build-provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          # macOS — Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # Linux (oldest supported Ubuntu for glibc compatibility)
          - platform: ubuntu-22.04
            args: ""
          # Windows
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    # No dependency caches in this job on purpose: it holds the signing key, and
    # a cache written by another (less trusted) run could inject code into the
    # signed build (cache poisoning). A clean build is slower but trustworthy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The local-test updater config (plain HTTP + insecure transport) must
      # never reach a release build.
      - name: Refuse test-only configuration
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
        run: |
          case "$BUILD_ARGS" in
            *--config*|*localtest*) echo "::error::release builds must use tauri.conf.json only"; exit 1 ;;
          esac

      # pnpm version: read from `packageManager` in package.json (single source).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in the release workflow (cache poisoning).
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          # Pre-install cross-compilation targets for macOS universal builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - run: pnpm install --frozen-lockfile

      - name: Build, sign & publish
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.detect.outputs.tag }}
          # The tag is created when the draft is published: pin it to the
          # commit that was built, not to whatever main is at that moment.
          releaseCommitish: ${{ github.sha }}
          releaseName: "BasicPresence v__VERSION__"
          # Draft so publishing is a manual final gate.
          # latest.json resolves for clients only once the release is published (non-prerelease).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # SLSA build provenance: anyone can check that an artifact was built by
      # this workflow from this commit (`gh attestation verify <file> -R <repo>`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}

  sbom:
    name: SBOM + checksums
    needs: [detect, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM / checksums to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CycloneDX SBOM of both dependency trees (pnpm-lock.yaml + Cargo.lock).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: basic-presence-${{ needs.detect.outputs.tag }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # SHA-256 of every published artifact: the AUR PKGBUILD pins these.
      - name: Upload SBOM and checksums to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          mkdir -p dist-release
          gh release download "$TAG" --dir dist-release --pattern '*.deb' --pattern '*.AppImage' --pattern '*.rpm' --pattern '*.dmg' --pattern '*.msi' --pattern '*.exe' -R "$GITHUB_REPOSITORY"
          (cd dist-release && sha256sum -- * > ../SHA256SUMS)
          gh release upload "$TAG" "basic-presence-${TAG}.cdx.json" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
