name: CI

on:
  push:
    branches: [main]
    # Tagged commits are what actually gets built, signed and shipped, so they
    # must clear the same gates as main — a tag pushed from a side branch used
    # to reach release.yml without any check having run on it.
    tags: ["v*"]
  pull_request:

# Least privilege: these jobs only ever read the repository. Without this block
# the token defaults to the repository-wide setting, which may grant write.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cargo.toml's version is not cosmetic: exported profile bundles are
      # stamped with CARGO_PKG_VERSION, so drift silently mislabels every shared
      # file. tauri.conf.json takes its version from package.json.
      - name: Check Cargo.toml and package.json versions agree
        shell: bash
        run: |
          js=$(node -p "require('./package.json').version")
          rs=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$js  Cargo.toml=$rs"
          if [ "$js" != "$rs" ]; then
            echo "::error::Version mismatch: package.json=$js but Cargo.toml=$rs"
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Two tiers, because "dev-only" and "ships to users" are not the same risk.
      # What reaches the binary is held to zero known advisories, at any
      # severity: a single sanitiser bug in production is worth more attention
      # than a DoS in a linter.
      - name: Audit production dependencies (blocking, any severity)
        run: pnpm audit --prod --audit-level=low

      # Build/lint tooling: visible, and blocking from moderate up. A previous
      # `high` threshold hid a moderate advisory affecting the exact dompurify
      # version an override had pinned to.
      - name: Audit all dependencies (blocking from moderate)
        run: pnpm audit --audit-level=moderate

  backend:
    name: Backend (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's Linux system dependencies (webkit2gtk, etc.).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  cargo-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
