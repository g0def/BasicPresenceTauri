[package]
name = "basic-presence"
description = "BasicPresence — suivi de présence et d'empreinte CO₂ (UI native Slint)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "basic_presence"
path = "src/lib.rs"

[[bin]]
name = "basic-presence"
path = "src/main.rs"

[dependencies]
basic-presence-core = { path = "../core" }
# UI native. Sans les features par défaut pour ne PAS tirer le backend Qt :
# backend winit (Wayland + X11, Windows, macOS), renderer femtovg (OpenGL) et
# renderer logiciel (repli sans GPU : SLINT_BACKEND=winit-software),
# accessibilité AccessKit.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    # Raw winit events: user activity for the idle timeout (API pinned with
    # the exact Slint version).
    "unstable-winit-030",
] }
# Runtime des use cases (libSQL, spawn_blocking d'Argon2…), distinct de la
# boucle d'événements de l'UI.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# Répertoire de données : même emplacement que l'`app_data_dir` de Tauri.
dirs = "7"
zeroize = "1"
# Local time zone for displayed timestamps.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
# Headless UI tests: screenshots of the software-rendered window.
png = "0.18"

[build-dependencies]
slint-build = "=1.18.1"
serde_json = "1"
