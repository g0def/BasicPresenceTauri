# Relèvements de sécurité de dépendances transitives — épinglés à la version
# exacte vérifiée (pas de borne ouverte `>=` qui accepterait n'importe quelle
# future version). À retirer quand les parents les embarqueront
# (vérifier avec `pnpm why <paquet>`).
overrides:
  dompurify: 3.4.17 # GHSA-cmwh-pvxp-8882, GHSA-c2j3-45gr-mqc4, GHSA-6688-9rhm-gjv2 (via @milkdown/crepe)
  esbuild: 0.28.2 # GHSA-g7r4-m6w7-qqqr (dev server Windows uniquement)
  katex: 0.19.0 # GHSA-238p-pmpm-9mq7 (via @milkdown/crepe > remark-math)
  postcss-selector-parser: 7.1.6 # CPU DoS (via @tailwindcss/typography, build uniquement)
