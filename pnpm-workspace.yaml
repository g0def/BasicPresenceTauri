# Supply-chain hardening (pnpm 11). See documentation/audit-securite-2026-10.md.

# Never install a version published less than 7 days ago: most malicious
# releases (Shai-Hulud-style worms, hijacked maintainer accounts) are detected
# and unpublished within hours or days. Stricter than the pnpm 11 default (1 day).
minimumReleaseAge: 10080

# Dependency lifecycle scripts are blocked unless explicitly listed below, and an
# unlisted package that wants to run one fails the install instead of being
# silently skipped — so a new build script is always a reviewed decision.
# Versions published less than 7 days before the security update of 2026-10-14
# (audit n°2), reviewed and accepted explicitly. Exact versions only: any newer
# release of these packages is still subject to the 7-day rule.
minimumReleaseAgeExclude:
