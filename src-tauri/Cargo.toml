[package]
name = "basic-presence"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "basic_presence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistance offline-first chiffrée (moteur libSQL / Turso), 100% locale en v1
libsql = { version = "0.9", features = ["encryption"] }
bytes = "1"

# Hachage de mot de passe & dérivation de clé (Argon2id)
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }

# Envelope encryption du DEK (AEAD authentifié, nonce 192 bits)
chacha20poly1305 = "0.10"

# Évidence d'altération du vault au repos (HMAC-SHA256 sur le fichier + comparaison
# constant-time). libSQL 0.9 ne chiffre qu'en AES-256-CBC non authentifié.
hmac = "0.12"
sha2 = "0.10"
subtle = "2"

# Scellement du keystore : clé de device stockée dans le trousseau OS.
# `sync-secret-service` + `crypto-rust` => backend pur Rust (zbus), pas de
# dépendance système à OpenSSL/libsecret au build (le Secret Service GNOME/KWallet
# reste requis au runtime sous Linux).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Aléatoire cryptographique, effacement mémoire, ids, erreurs, encodage
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
base64 = "0.22"
async-trait = "0.1"

# Rendu des notes Markdown -> HTML côté backend (source de vérité = Markdown brut).
# comrak en `default-features = false` écarte sa CLI + son intégration syntect par
# défaut (qui tire onig, une dépendance C). On branche notre propre coloration via
# syntect en `default-fancy` (moteur regex pur-Rust `fancy-regex`, donc PAS de dep C).
# Le HTML est ensuite assaini par Ammonia (whitelist html5ever) avant la WebView.
comrak = { version = "0.52.0", default-features = false }
ammonia = "4.1.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

