# Advisories acknowledged after review (audit du 14/10/2026, voir
# documentation/audit-securite-2026-10.md). Each entry must state why it is not
# reachable; re-check them whenever the parent crate is bumped.
[advisories]
ignore = [
    # --- libsql 0.9 remote client stack (hyper 0.14 / rustls 0.22 / tonic).
    # v1 opens the database with `Builder::new_local` only: no network
    # connection is ever made through it. Revisit with Turso sync (Phase 2)
    # or the libsql 0.10 migration.
    "RUSTSEC-2026-0258", # h2 0.3: unbounded empty DATA frames
    "RUSTSEC-2026-0346", # rustls 0.22: Debug impls expose TLS secrets
    "RUSTSEC-2026-0349", # rustls 0.22: ServerHello PQ downgrade
    "RUSTSEC-2026-0049", # rustls-webpki 0.102: CRL distribution point
    "RUSTSEC-2026-0098", # rustls-webpki 0.102: URI name constraints
    "RUSTSEC-2026-0099", # rustls-webpki 0.102: wildcard name constraints
    "RUSTSEC-2026-0104", # rustls-webpki 0.102: CRL parsing panic
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained

    # --- quick-xml 0.38 / 0.39 parsing DoS. spreadsheet-ods only *writes* our
    # own .ods (never parses user input); plist (via syntect) only loads the
    # themes embedded at compile time; calamine is a dev-dependency (tests).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # --- Unmaintained / unsound transitive crates with no fix upstream,
    # pulled by tauri (gtk/glib), syntect (bincode, yaml-rust) and macros.
    "RUSTSEC-2025-0141", # bincode unmaintained (syntect dumps, trusted data)
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (build time only)
    "RUSTSEC-2024-0320", # yaml-rust unmaintained (syntect, trusted data)
    "RUSTSEC-2024-0429", # glib VariantStrIter unsoundness (API unused)
]
